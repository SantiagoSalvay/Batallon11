name: Security checks

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit client
        run: pnpm --filter batallon11-client audit --audit-level moderate

      - name: Audit server
        run: pnpm --filter batallon11-server audit --audit-level moderate

      - name: Run server tests
        run: pnpm --filter batallon11-server test

      - name: Run client tests
        run: pnpm --filter batallon11-client test
