# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Batallon11

on:
  push:
    branches:
      - Producción
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Build client
        env:
          VITE_API_URL: https://batallon11-fzc8apdfaegnhdg9.eastus-01.azurewebsites.net
          VITE_MAPS_EMBED_URL: https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d523.8332374402514!2d-64.26843433039825!3d-31.393524440983576!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94329f1ee5ef67b7%3A0xd59e5978f38ad3!2sBatall%C3%B3n%2011%20Gral.%20Jos%C3%A9%20Mar%C3%ADa%20Paz.!5e1!3m2!1ses!2sar!4v1781791401204!5m2!1ses!2sar
          VITE_MAPS_OPEN_URL: https://www.google.com/maps/place/Batall%C3%B3n+11+Gral.+Jos%C3%A9+Mar%C3%ADa+Paz./@-31.3935244,-64.2684343,17z
        run: pnpm --filter batallon11-client build

      - name: Assemble deployment package
        run: |
          mkdir -p deploy/server
          rsync -a server/ deploy/server/ \
            --exclude node_modules \
            --exclude .env \
            --exclude uploads
          rsync -a shared/ deploy/shared/
          mkdir -p deploy/server/public
          cp -r client/dist/* deploy/server/public/
          cd deploy/server
          npm install -g npm@latest
          npm install --omit=dev
          cd ../..
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Extract deployment package
        run: |
          mkdir -p deploy
          tar -xzf deploy.tar.gz -C deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_861C9FBB396B478F8F8287F13AB58CB0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_18C7AB68DD3744268C9FB6116F038434 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3D2B748381BE4374914A2A7A420C83B6 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Batallon11'
          slot-name: 'Production'
          package: deploy